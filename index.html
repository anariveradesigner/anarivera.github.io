<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana Rivera — Welcome</title>
<link rel="icon" type="image/png" href="static/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --gold: #F0C61D;
    --dark: #303030;
    --white: #ffffff;
    --gray: #9CA3AF;
    --gold-dim: rgba(240,198,29,0.05);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--dark);
    color: var(--white);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow: hidden;
    cursor: none;
  }

  /* NOISE TEXTURE OVERLAY */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.5;
  }

  .headline-container {
    text-align: center;
    padding: 48px 14px 32px;
    z-index: 10;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .headline-container h1 {
    font-family: 'League Spartan', sans-serif;
    font-size: clamp(24px, 4vw, 48px);
    color: var(--white);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .headline-container h1 .highlight {
    /* ACTUALIZADO: Glimmer ultra evidente con mayor contraste */
    background: linear-gradient(
      to right, 
      #6b6b6b 16%,    /* Extremos más oscuros para que el blanco resalte */
      #ffffff 45%,    /* Centro blanco brillante */
      #ffffff 55%, 
      #6b6b6b 90%
    );
    background-size: 250% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: brilloGlimmer 2.8s linear infinite; /* Un poco más veloz para notar el flujo */
    font-weight: 700;
  }

  @keyframes brilloGlimmer {
    to {
      background-position: 250% center;
    }
  }

  .split-container {
    display: flex;
    flex-direction: column;
    flex: 1;
    z-index: 10;
  }

  @media (min-width: 768px) {
    .split-container {
      flex-direction: row;
    }
  }

  /* CONFIGURACIÓN DE SPLITS INDEPENDIENTES (UX/UI Themes) */
  .split-portfolio {
    --accent-color: #AF6E92; /* Tu Rosa AF6E92 */
    --accent-dim: rgba(175, 110, 146, 0.05); /* Fondo sutil hover */
    --accent-border: rgba(175, 110, 146, 0.3); /* Borde hover */
  }

  .split-lagom {
    --accent-color: var(--gold); /* Amarillo actual */
    --accent-dim: var(--gold-dim);
    --accent-border: rgba(240, 198, 29, 0.3);
  }

  .split-half {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
    text-align: center;
    text-decoration: none;
    color: inherit;
    border-right: 1px solid rgba(255,255,255,0.1);
    transition: background 0.4s ease, border-color 0.4s ease;
    cursor: none;
    position: relative;
    overflow: hidden;
  }

  .split-half:last-child {
    border-right: none;
  }

  /* El fondo del hover ahora usa la variable dinámica */
  .split-half::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent-dim);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .split-half:hover::before {
    opacity: 1;
  }

  /* El borde del hover ahora usa la variable dinámica */
  .split-half:hover {
    border-color: var(--accent-border);
  }

  /* Logo placeholder */
  .logo-container {
    width: 100%;
    max-width: 400px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
    transition: transform 0.4s ease;
  }

  .split-half:hover .logo-container {
    transform: translateY(-10px);
  }

  .logo-placeholder {
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.03);
    border: 2px dashed rgba(255,255,255,0.1);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    font-weight: 300;
  }

  .logo-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none; 
  }

  .logo-image[src]:not([src=""]) {
    display: block;
  }

  .logo-image[src]:not([src=""]) ~ .logo-placeholder {
    display: none;
  }

  #lagom-logo {
    max-width: 72%;
  }

  .supporting-text {
    font-size: clamp(16px, 1.5vw, 16px);
    font-weight: 300;
    color: var(--gray);
    max-width: 400px;
    line-height: 1.7;
    position: relative;
    z-index: 1;
  }

  /* La flecha ahora usa la variable dinámica */
  .arrow-icon {
    margin-top: 16px;
    color: var(--accent-color);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    position: relative;
    z-index: 1;
  }

  .split-half:hover .arrow-icon {
    opacity: 1;
    transform: translateY(0);
  }

  /* CUSTOM CURSOR */
  .cursor {
    position: fixed;
    width: 12px;
    height: 12px;
    background: var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.3s ease, height 0.3s ease, background-color 0.3s ease;
    mix-blend-mode: difference;
  }

  .cursor-ring {
    position: fixed;
    width: 36px;
    height: 36px;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.3s ease, height 0.3s ease, opacity 0.3s ease, border-color 0.3s ease;
    opacity: 0.6;
  }

  .cursor.hover {
    width: 20px;
    height: 20px;
  }

  .cursor-ring.hover {
    width: 56px;
    height: 56px;
  }

  /* Responsive adjustments */
  @media (max-width: 767px) {
    .split-half {
      border-right: none;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .split-half:last-child {
      border-bottom: none;
    }

    .logo-container {
      height: 150px;
      margin-bottom: 20px;
    }
  }

</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

  <div class="headline-container">
    <h1>One designer and developer,<br>
      two ways to <span class="highlight">work together!</span></h1>
  </div>

  <div class="split-container">
    <a href="portfolio.html" class="split-half split-portfolio" data-hover>
      <div class="logo-container">
        <img src="static/ana-logo.png" alt="Ana Rivera Logo" class="logo-image" id="ana-logo">
        <div class="logo-placeholder">Ana Rivera Logo<br>Designer & Dev</div>
      </div>
      <p class="supporting-text">Click here if you're a company or recruiter looking for a UX/UI designer and developer.</p>
      <svg class="arrow-icon" width="32" height="32" viewBox="0 0 24 24" fill="none">
        <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <a href="lagom.html" class="split-half split-lagom" data-hover>
      <div class="logo-container">
        <img src="static/lagom-logo.png" alt="Lagom Studio Logo" class="logo-image" id="lagom-logo">
        <div class="logo-placeholder">Lagom Studio Logo<br>Web Studio</div>
      </div>
      <p class="supporting-text">Click here if you're an individual or startup with a fresh project in mind.</p>
      <svg class="arrow-icon" width="32" height="32" viewBox="0 0 24 24" fill="none">
        <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>

<script>
// Custom cursor
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursorRing');
let mouseX = 0, mouseY = 0;
let ringX = 0, ringY = 0;

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  cursor.style.left = mouseX + 'px';
  cursor.style.top = mouseY + 'px';
});

function animateRing() {
  ringX += (mouseX - ringX) * 0.12;
  ringY += (mouseY - ringY) * 0.12;
  cursorRing.style.left = ringX + 'px';
  cursorRing.style.top = ringY + 'px';
  requestAnimationFrame(animateRing);
}
animateRing();

// Hover effects on cursor + Cambio de color inteligente según la sección
document.querySelectorAll('[data-hover]').forEach(el => {
  el.addEventListener('mouseenter', () => {
    cursor.classList.add('hover');
    cursorRing.classList.add('hover');
    
    // Si entramos a la sección de Ana Rivera, el cursor se vuelve rosa
    if (el.classList.contains('split-portfolio')) {
      cursor.style.backgroundColor = '#AF6E92';
      cursorRing.style.borderColor = '#AF6E92';
    } else {
      // Si entramos a Lagom, se vuelve amarillo
      cursor.style.backgroundColor = 'var(--gold)';
      cursorRing.style.borderColor = 'var(--gold)';
    }
  });
  
  el.addEventListener('mouseleave', () => {
    cursor.classList.remove('hover');
    cursorRing.classList.remove('hover');
    // Al salir, vuelve al color base oro
    cursor.style.backgroundColor = 'var(--gold)';
    cursorRing.style.borderColor = 'var(--gold)';
  });
});

// TO ADD YOUR LOGOS: Uncomment and set the paths below
document.getElementById('ana-logo').src = 'static/ana-logo.png';
document.getElementById('lagom-logo').src = 'static/lagom-logo.png';
</script>

</body>
</html>
